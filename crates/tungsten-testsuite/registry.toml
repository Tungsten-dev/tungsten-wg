# Records and externs known to the test environment. Names are unique (no overloads), so f32
# variants carry a `_f32` suffix. Type spellings are those of tungsten-parse SPEC §5.4.

[[record]]
name = "Pair"
fields = [{ name = "a", type = "f64" }, { name = "b", type = "i32" }]

[[record]]
name = "Wrap"
fields = [{ name = "p", type = "extern Pair" }, { name = "v", type = "vec3" }]

[[extern]]
name = "sqrt"
params = ["f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "floor"
params = ["f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "ceil"
params = ["f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "trunc"
params = ["f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "abs"
params = ["f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "min"
params = ["f64", "f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "max"
params = ["f64", "f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "copysign"
params = ["f64", "f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "fma"
params = ["f64", "f64", "f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "sqrt_f32"
params = ["f32"]
ret = "f32"
domain_error = false

[[extern]]
name = "floor_f32"
params = ["f32"]
