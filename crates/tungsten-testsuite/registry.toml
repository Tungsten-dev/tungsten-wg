domain_error = false

[[extern]]
name = "min"
params = ["f64", "f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "max"
params = ["f64", "f64"]
ret = "f64"
domain_error = false

[[extern]]
name = "copysign"
