[package]
name = "tungsten-wg"
version = "0.2.1"
edition = "2024"
description = "A compiler / code generator for world generation (Rust and CUDA)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tungsten-dev/tungsten-wg"
keywords = ["minecraft", "worldgen", "compiler", "cuda", "codegen"]
categories = ["compilers"]
exclude = [
    ".git/",
    ".github/",

]

[workspace]
members = [
    "crates/tungsten-builder",
    "crates/tungsten-check",
    "crates/tungsten-codegen",
    "crates/tungsten-core",
    "crates/tungsten-cuda",
    "crates/tungsten-interface",
    "crates/tungsten-java",
    "crates/tungsten-inspect",
    "crates/tungsten-ir",
    "crates/tungsten-optimizer",
    "crates/tungsten-parse",
    "crates/tungsten-rust",
    "crates/tungsten-testsuite",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tungsten-dev/tungsten-wg"

[workspace.dependencies]
bumpalo = "3.19.0"
codespan-reporting = { version = "0.13.1", default-features = false, features = ["std"] }
logos = "0.16.1"
md5 = "0.8.0"
proptest = "1.12.0"
stacker = "0.1.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.40"
toml = "0.8"
libtest-mimic = "0.8"
insta = "1"
# Pinned together with VERUS_TAG in scripts/verify.sh (the script checks it).
vstd = "=0.0.0-2026-10-25-0158"
tungsten-ir = { path = "crates/tungsten-ir", version = "0.2.1" }
tungsten-codegen = { path = "crates/tungsten-codegen", version = "0.2.1" }
tungsten-interface = { path = "crates/tungsten-interface", version = "0.2.1" }
tungsten-optimizer = { path = "crates/tungsten-optimizer", version = "0.2.1" }
tungsten-rust = { path = "crates/tungsten-rust", version = "0.2.1" }
tungsten-java = { path = "crates/tungsten-java", version = "0.2.1" }
tungsten-cuda = { path = "crates/tungsten-cuda", version = "0.2.1" }
tungsten-inspect = { path = "crates/tungsten-inspect", version = "0.2.1" }
tungsten-parse = { path = "crates/tungsten-parse", version = "0.2.1" }
tungsten-core = { path = "crates/tungsten-core", version = "0.2.1" }
tungsten-check = { path = "crates/tungsten-check", version = "0.2.1" }

[features]
default = ["rust"]
rust = ["dep:tungsten-rust"]
java = ["dep:tungsten-java"]
inspect = ["dep:tungsten-inspect"]
cuda = ["dep:tungsten-cuda"]
parse = ["dep:tungsten-parse"]

[dependencies]
tungsten-ir.workspace = true
tungsten-builder.workspace = true
tungsten-codegen.workspace = true
tungsten-interface.workspace = true
tungsten-optimizer.workspace = true
tungsten-rust = { workspace = true, optional = true }
tungsten-java = { workspace = true, optional = true }
tungsten-inspect = { workspace = true, optional = true }
tungsten-cuda = { workspace = true, optional = true }
tungsten-parse = { workspace = true, optional = true }
tungsten-check.workspace = true

[lib]
name = "tungsten_wg"
path = "src/lib.rs"