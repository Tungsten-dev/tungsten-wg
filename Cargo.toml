[package]
name = "tungsten-wg"
version = "0.2.0"
edition = "2024"
description = "A compiler / code generator for world generation (Rust and CUDA)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tungsten-dev/tungsten-wg"
keywords = ["minecraft", "worldgen", "compiler", "cuda", "codegen"]
categories = ["compilers"]
exclude = [
    ".git/",
    ".github/",

]

[workspace]
members = [
    "crates/tungsten-codegen",
    "crates/tungsten-cuda",
    "crates/tungsten-interface",
    "crates/tungsten-java",
    "crates/tungsten-inspect",
    "crates/tungsten-ir",
    "crates/tungsten-legacy",
    "crates/tungsten-optimizer",
    "crates/tungsten-rust",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tungsten-dev/tungsten-wg"

[workspace.dependencies]
bumpalo = "3.19.0"
md5 = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.40"
tungsten-ir = { path = "crates/tungsten-ir", version = "0.2.0" }
tungsten-codegen = { path = "crates/tungsten-codegen", version = "0.2.0" }
tungsten-interface = { path = "crates/tungsten-interface", version = "0.2.0" }
tungsten-optimizer = { path = "crates/tungsten-optimizer", version = "0.2.0" }
tungsten-rust = { path = "crates/tungsten-rust", version = "0.2.0" }
tungsten-java = { path = "crates/tungsten-java", version = "0.2.0" }
tungsten-cuda = { path = "crates/tungsten-cuda", version = "0.2.0" }
tungsten-legacy = { path = "crates/tungsten-legacy", version = "0.2.0" }
tungsten-inspect = { path = "crates/tungsten-inspect", version = "0.2.0" }

[features]
default = ["rust"]
rust = ["dep:tungsten-rust"]
java = ["dep:tungsten-java"]
inspect = ["dep:tungsten-inspect"]
cuda = ["dep:tungsten-cuda"]

[dependencies]
thiserror.workspace = true
tungsten-ir.workspace = true
tungsten-codegen.workspace = true
tungsten-interface.workspace = true
tungsten-optimizer.workspace = true
tungsten-legacy.workspace = true
tungsten-rust = { workspace = true, optional = true }
tungsten-java = { workspace = true, optional = true }
tungsten-inspect = { workspace = true, optional = true }
tungsten-cuda = { workspace = true, optional = true }

[lib]
name = "tungsten_wg"
path = "src/lib.rs"